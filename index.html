<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Beranda — Akbar</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f4ef;
  --white:#ffffff;
  --text:#1a1a18;
  --text2:#6b6b62;
  --text3:#a0a096;
  --border:rgba(0,0,0,0.08);
  --shadow:0 4px 24px rgba(0,0,0,0.07);
}
body{
  font-family:'Plus Jakarta Sans',sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:2rem 1rem;
}
.wrap{max-width:480px;width:100%;}

.greeting{
  text-align:center;
  margin-bottom:2.5rem;
}
.greeting-sub{
  font-size:13px;
  color:var(--text3);
  margin-bottom:6px;
  letter-spacing:0.5px;
  text-transform:uppercase;
}
.greeting-name{
  font-size:28px;
  font-weight:700;
  color:var(--text);
  margin-bottom:4px;
}
.greeting-date{
  font-size:13px;
  color:var(--text2);
}

.apps{
  display:flex;
  flex-direction:column;
  gap:14px;
}

.app-card{
  background:var(--white);
  border-radius:18px;
  border:0.5px solid var(--border);
  box-shadow:var(--shadow);
  padding:20px 22px;
  display:flex;
  align-items:center;
  gap:18px;
  text-decoration:none;
  color:inherit;
  transition:transform 0.15s, box-shadow 0.15s;
  cursor:pointer;
}
.app-card:hover{
  transform:translateY(-2px);
  box-shadow:0 8px 32px rgba(0,0,0,0.11);
}
.app-card:active{transform:scale(0.98);}

.app-icon{
  width:56px;height:56px;
  border-radius:14px;
  display:flex;align-items:center;justify-content:center;
  font-size:26px;
  flex-shrink:0;
}

.app-info{flex:1;}
.app-name{font-size:16px;font-weight:600;color:var(--text);margin-bottom:3px;}
.app-desc{font-size:12px;color:var(--text2);line-height:1.5;}

.app-arrow{
  font-size:18px;
  color:var(--text3);
  flex-shrink:0;
}

/* warna per app */
.icon-habit{background:#e8f4fd;}
.icon-ibadah{background:#d8f3dc;}

.footer{
  text-align:center;
  margin-top:2.5rem;
  font-size:12px;
  color:var(--text3);
}
</style>
</head>
<body>

<div class="wrap">
  <div class="greeting">
    <div class="greeting-sub">Selamat datang 👋</div>
    <div class="greeting-name">Halo, Akbar!</div>
    <div class="greeting-date" id="greetDate"></div>
  </div>

  <div class="apps">
    <a class="app-card" href="habit-tracker.html">
      <div class="app-icon icon-habit">📋</div>
      <div class="app-info">
        <div class="app-name">Habit Tracker</div>
        <div class="app-desc">Catat dan pantau kebiasaan harianmu. Lihat grafik progress & ekspor ke PDF.</div>
      </div>
      <div class="app-arrow">›</div>
    </a>

    <a class="app-card" href="ibadah-tracker.html">
      <div class="app-icon icon-ibadah">🕌</div>
      <div class="app-info">
        <div class="app-name">Catatan Ibadah</div>
        <div class="app-desc">Checklist shalat wajib & sunnah, tilawah Al-Quran, dan progress khatam.</div>
      </div>
      <div class="app-arrow">›</div>
    </a>
  </div>

  <div class="footer">
    Dibuat dengan ❤️ — akbararsyad.github.io/habittracker
  </div>
</div>

<script>
const DAYS=['Ahad','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const MONTHS=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const now=new Date();
const hour=now.getHours();
const greet=hour<11?'Selamat pagi ☀️':hour<15?'Selamat siang 🌤':hour<18?'Selamat sore 🌇':'Selamat malam 🌙';
document.getElementById('greetDate').textContent=`${greet} · ${DAYS[now.getDay()]}, ${now.getDate()} ${MONTHS[now.getMonth()]} ${now.getFullYear()}`;
</script>
</body>
</html>
