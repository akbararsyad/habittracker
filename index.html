<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Habit Tracker Pribadiku</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #ffffff;
      --bg2: #f5f5f3;
      --bg3: #efefec;
      --text: #1a1a18;
      --text2: #6b6b66;
      --text3: #a0a09a;
      --border: rgba(0,0,0,0.12);
      --border2: rgba(0,0,0,0.22);
      --radius-md: 8px;
      --radius-lg: 12px;
      --accent: #7F77DD;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1c1a;
        --bg2: #262624;
        --bg3: #2e2e2b;
        --text: #f0f0ec;
        --text2: #a0a09a;
        --text3: #6b6b66;
        --border: rgba(255,255,255,0.1);
        --border2: rgba(255,255,255,0.2);
      }
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg3);
      color: var(--text);
      min-height: 100vh;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 2rem 1rem;
    }

    h1 { font-size: 24px; font-weight: 600; margin-bottom: 4px; }
    .subtitle { font-size: 14px; color: var(--text2); margin-bottom: 1.5rem; }

    .card {
      background: var(--bg);
      border-radius: var(--radius-lg);
      border: 0.5px solid var(--border);
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .tabs {
      display: flex;
      gap: 4px;
      border-bottom: 0.5px solid var(--border);
      margin-bottom: 1.5rem;
    }

    .tab {
      padding: 8px 18px;
      font-size: 14px;
      cursor: pointer;
      border: none;
      background: none;
      color: var(--text2);
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      font-family: inherit;
      transition: color 0.15s;
    }

    .tab.active {
      color: var(--text);
      border-bottom: 2px solid var(--accent);
      font-weight: 500;
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .add-row {
      display: flex;
      gap: 8px;
      margin-bottom: 1.5rem;
      align-items: center;
      flex-wrap: wrap;
    }

    input[type=text] {
      flex: 1;
      min-width: 160px;
      padding: 8px 12px;
      border: 0.5px solid var(--border2);
      border-radius: var(--radius-md);
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
      outline: none;
    }

    input[type=text]:focus { border-color: var(--accent); }

    button {
      padding: 8px 14px;
      border: 0.5px solid var(--border2);
      border-radius: var(--radius-md);
      background: var(--bg);
      color: var(--text);
      cursor: pointer;
      font-size: 14px;
      font-family: inherit;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: background 0.1s;
    }

    button:hover { background: var(--bg2); }
    button:active { transform: scale(0.98); }

    .color-pick { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .cp {
      width: 22px; height: 22px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
      flex-shrink: 0;
      transition: border 0.15s;
    }
    .cp.selected { border: 2px solid var(--text); }

    .month-nav {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 1rem;
    }

    .month-label {
      font-size: 16px;
      font-weight: 500;
      min-width: 160px;
    }

    .habit-section { margin-bottom: 1.5rem; }

    .habit-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .habit-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
    .habit-name { font-size: 15px; font-weight: 500; flex: 1; }
    .habit-meta { font-size: 12px; color: var(--text2); }

    .del-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text3);
      padding: 2px 6px;
      border-radius: 4px;
    }
    .del-btn:hover { color: #E24B4A; background: #FCEBEB; }

    .grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
    }

    .day-head {
      text-align: center;
      font-size: 11px;
      color: var(--text3);
      padding-bottom: 3px;
    }

    .day-cell {
      aspect-ratio: 1;
      border-radius: 6px;
      border: 0.5px solid var(--border);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      color: var(--text3);
      position: relative;
      user-select: none;
      transition: background 0.1s;
    }

    .day-cell.empty { background: none; border: none; cursor: default; }
    .day-cell.done { border-color: transparent; color: #fff; }
    .day-cell.today-border { outline: 2px solid var(--accent); outline-offset: 1px; }
    .day-cell:not(.empty):not(.done):hover { background: var(--bg2); }
    .day-cell.has-note::after {
      content: '';
      width: 5px; height: 5px;
      border-radius: 50%;
      background: #fff;
      position: absolute;
      bottom: 2px; right: 2px;
    }
    .day-cell:not(.done).has-note::after { background: var(--accent); }

    .stats-row {
      display: flex;
      gap: 10px;
      margin-top: 1.5rem;
      flex-wrap: wrap;
    }

    .stat-card {
      flex: 1;
      min-width: 70px;
      background: var(--bg2);
      border-radius: var(--radius-md);
      padding: 12px;
      text-align: center;
    }

    .stat-num { font-size: 22px; font-weight: 500; }
    .stat-lbl { font-size: 12px; color: var(--text2); margin-top: 2px; }

    .empty-state {
      text-align: center;
      padding: 2rem;
      color: var(--text2);
      font-size: 14px;
      border: 0.5px dashed var(--border2);
      border-radius: var(--radius-lg);
    }

    .modal-bg {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    .modal-bg.open { display: flex; }

    .modal {
      background: var(--bg);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      width: 320px;
      border: 0.5px solid var(--border2);
    }

    .modal h3 { font-size: 16px; font-weight: 500; margin-bottom: 4px; }
    .modal-sub { font-size: 12px; color: var(--text2); margin-bottom: 12px; }

    textarea {
      width: 100%;
      height: 100px;
      resize: vertical;
      font-family: inherit;
      font-size: 14px;
      padding: 8px 12px;
      border: 0.5px solid var(--border2);
      border-radius: var(--radius-md);
      background: var(--bg);
      color: var(--text);
      outline: none;
    }

    textarea:focus { border-color: var(--accent); }

    .modal-btns {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      justify-content: flex-end;
    }

    .chart-wrap {
      background: var(--bg2);
      border-radius: var(--radius-lg);
      padding: 1rem;
      margin-bottom: 1rem;
    }

    .chart-title {
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .bar-chart {
      display: flex;
      align-items: flex-end;
      gap: 6px;
      height: 120px;
    }

    .bar-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      height: 100%;
      justify-content: flex-end;
    }

    .bar {
      width: 100%;
      border-radius: 4px 4px 0 0;
      min-height: 4px;
      transition: height 0.3s;
    }

    .bar-lbl { font-size: 9px; color: var(--text3); text-align: center; }
    .bar-val { font-size: 10px; color: var(--text2); }

    .note-list { display: flex; flex-direction: column; gap: 10px; }

    .note-card {
      background: var(--bg2);
      border-radius: var(--radius-md);
      padding: 12px;
      border-left: 3px solid;
    }

    .note-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .note-date { font-size: 12px; color: var(--text2); }
    .note-habit { font-size: 12px; font-weight: 500; }
    .note-text { font-size: 14px; line-height: 1.5; }

    .tip {
      font-size: 12px;
      color: var(--text3);
      margin-top: 6px;
    }

    @media (max-width: 480px) {
      .add-row { flex-direction: column; align-items: stretch; }
      input[type=text] { min-width: unset; }
    }
  </style>
</head>
<body>
<div class="container">
  <h1>📋 Habit Tracker Pribadiku</h1>
  <p class="subtitle">Catat, pantau, dan ekspor kebiasaanmu setiap hari!</p>

  <div class="card">
    <div class="tabs">
      <button class="tab active" onclick="switchTab('tracker')">📅 Tracker</button>
      <button class="tab" onclick="switchTab('grafik')">📊 Grafik</button>
      <button class="tab" onclick="switchTab('catatan')">📝 Catatan</button>
    </div>

    <!-- TAB TRACKER -->
    <div id="tab-tracker" class="tab-content active">
      <div class="add-row">
        <input type="text" id="habitInput" placeholder="Nama kebiasaan baru..." maxlength="40" />
        <div class="color-pick" id="colorPick"></div>
        <button onclick="addHabit()"><i class="ti ti-plus"></i> Tambah</button>
      </div>
      <p class="tip">💡 Klik kanan pada kotak hari untuk menambahkan catatan harian</p>
      <div class="month-nav" style="margin-top:1rem">
        <button onclick="changeMonth(-1)">‹ Prev</button>
        <span class="month-label" id="monthLabel"></span>
        <button onclick="changeMonth(1)">Next ›</button>
      </div>
      <div id="habitList"></div>
      <div class="stats-row" id="statsRow"></div>
    </div>

    <!-- TAB GRAFIK -->
    <div id="tab-grafik" class="tab-content">
      <div class="month-nav">
        <button onclick="changeMonth(-1); renderGrafik()">‹ Prev</button>
        <span class="month-label" id="monthLabelG"></span>
        <button onclick="changeMonth(1); renderGrafik()">Next ›</button>
      </div>
      <div id="grafikContent"></div>
    </div>

    <!-- TAB CATATAN -->
    <div id="tab-catatan" class="tab-content">
      <div id="catatanContent"></div>
    </div>
  </div>
</div>

<!-- MODAL CATATAN -->
<div class="modal-bg" id="noteModal">
  <div class="modal">
    <h3 id="modalTitle">Catatan Harian</h3>
    <p class="modal-sub" id="modalSub"></p>
    <textarea id="noteText" placeholder="Tulis catatanmu di sini..."></textarea>
    <div class="modal-btns">
      <button onclick="closeModal()">Batal</button>
      <button onclick="saveNote()"><i class="ti ti-check"></i> Simpan</button>
    </div>
  </div>
</div>

<script>
const COLORS = ['#7F77DD','#1D9E75','#D85A30','#D4537E','#378ADD','#639922','#EF9F27','#E24B4A'];
const DAYS = ['Min','Sen','Sel','Rab','Kam','Jum','Sab'];
const MONTHS = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];

let state = {
  habits: [], logs: {}, notes: {},
  viewYear: new Date().getFullYear(),
  viewMonth: new Date().getMonth(),
  selectedColor: COLORS[0],
  nextId: 1,
};

try {
  const s = JSON.parse(localStorage.getItem('habitTrackerV2') || '{}');
  if (s.habits) state = {...state, ...s};
} catch(e) {}

let modalCtx = null;

function save() {
  try { localStorage.setItem('habitTrackerV2', JSON.stringify(state)); } catch(e) {}
}

function logKey(hid, y, m, d) { return `${hid}_${y}_${m}_${d}`; }
function noteKey(hid, y, m, d) { return `n_${hid}_${y}_${m}_${d}`; }
function today() { const n = new Date(); return {y: n.getFullYear(), m: n.getMonth(), d: n.getDate()}; }
function getDaysInMonth(y, m) { return new Date(y, m+1, 0).getDate(); }
function getFirstDay(y, m) { return new Date(y, m, 1).getDay(); }

function switchTab(name) {
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  const idx = ['tracker','grafik','catatan'].indexOf(name);
  document.querySelectorAll('.tab')[idx].classList.add('active');
  if (name === 'grafik') renderGrafik();
  if (name === 'catatan') renderCatatan();
}

function renderColorPick() {
  document.getElementById('colorPick').innerHTML = COLORS.map(c =>
    `<div class="cp${state.selectedColor===c?' selected':''}" style="background:${c}" title="${c}" onclick="selectColor('${c}')"></div>`
  ).join('');
}

function selectColor(hex) { state.selectedColor = hex; renderColorPick(); }

function addHabit() {
  const inp = document.getElementById('habitInput');
  const name = inp.value.trim();
  if (!name) return;
  state.habits.push({ id: state.nextId++, name, color: state.selectedColor });
  inp.value = '';
  save(); render();
}

function deleteHabit(id) {
  if (!confirm('Hapus kebiasaan ini?')) return;
  state.habits = state.habits.filter(h => h.id !== id);
  save(); render();
}

function toggleDay(hid, y, m, d) {
  const k = logKey(hid, y, m, d);
  state.logs[k] = !state.logs[k];
  save(); render();
}

function openNote(hid, y, m, d) {
  const h = state.habits.find(h => h.id === hid);
  modalCtx = {hid, y, m, d};
  document.getElementById('modalTitle').textContent = h ? h.name : 'Catatan';
  document.getElementById('modalSub').textContent = `${d} ${MONTHS[m]} ${y}`;
  document.getElementById('noteText').value = state.notes[noteKey(hid,y,m,d)] || '';
  document.getElementById('noteModal').classList.add('open');
}

function closeModal() { document.getElementById('noteModal').classList.remove('open'); modalCtx = null; }

function saveNote() {
  if (!modalCtx) return;
  const {hid,y,m,d} = modalCtx;
  const txt = document.getElementById('noteText').value.trim();
  const k = noteKey(hid,y,m,d);
  if (txt) state.notes[k] = txt; else delete state.notes[k];
  save(); closeModal(); render();
  if (document.getElementById('tab-catatan').classList.contains('active')) renderCatatan();
}

function changeMonth(dir) {
  state.viewMonth += dir;
  if (state.viewMonth > 11) { state.viewMonth = 0; state.viewYear++; }
  if (state.viewMonth < 0)  { state.viewMonth = 11; state.viewYear--; }
  render();
}

function calcStreak(hid, y, m, totalDays, td) {
  let streak = 0;
  const endDay = (td.y===y && td.m===m) ? td.d : totalDays;
  for (let d = endDay; d >= 1; d--) {
    if (state.logs[logKey(hid,y,m,d)]) streak++;
    else break;
  }
  return streak;
}

function render() {
  const { viewYear: y, viewMonth: m } = state;
  const lbl = `${MONTHS[m]} ${y}`;
  ['monthLabel','monthLabelG'].forEach(id => { const el = document.getElementById(id); if(el) el.textContent = lbl; });

  const totalDays = getDaysInMonth(y, m);
  const firstDay = getFirstDay(y, m);
  const td = today();
  const listEl = document.getElementById('habitList');

  if (state.habits.length === 0) {
    listEl.innerHTML = `<div class="empty-state"><i class="ti ti-notes" style="font-size:28px;display:block;margin-bottom:8px"></i>Belum ada kebiasaan. Tambahkan di atas!</div>`;
    document.getElementById('statsRow').innerHTML = '';
    return;
  }

  let totalDone = 0, totalPossible = 0;

  listEl.innerHTML = state.habits.map(h => {
    const dayHeads = DAYS.map(d => `<div class="day-head">${d}</div>`).join('');
    const blanks = Array(firstDay).fill(`<div class="day-cell empty"></div>`).join('');
    let doneCnt = 0;
    const cells = Array.from({length: totalDays}, (_, i) => {
      const d = i + 1;
      const done = !!state.logs[logKey(h.id,y,m,d)];
      const hasNote = !!state.notes[noteKey(h.id,y,m,d)];
      const isToday = td.y===y && td.m===m && td.d===d;
      if (done) doneCnt++;
      const bg = done ? `background:${h.color};` : '';
      const cls = ['day-cell', done?'done':'', isToday?'today-border':'', hasNote?'has-note':''].filter(Boolean).join(' ');
      return `<div class="${cls}" style="${bg}"
        onclick="toggleDay(${h.id},${y},${m},${d})"
        oncontextmenu="event.preventDefault();openNote(${h.id},${y},${m},${d})"
        title="${d} ${MONTHS[m]} — klik kanan untuk catatan">${d}</div>`;
    }).join('');

    totalDone += doneCnt;
    totalPossible += totalDays;
    const pct = Math.round((doneCnt/totalDays)*100);
    const streak = calcStreak(h.id, y, m, totalDays, td);

    return `<div class="habit-section">
      <div class="habit-header">
        <div class="habit-dot" style="background:${h.color}"></div>
        <span class="habit-name">${h.name}</span>
        <span class="habit-meta">${doneCnt}/${totalDays} · ${pct}% · 🔥${streak}</span>
        <button class="del-btn" onclick="deleteHabit(${h.id})" title="Hapus"><i class="ti ti-trash"></i></button>
      </div>
      <div class="grid">${dayHeads}${blanks}${cells}</div>
    </div>`;
  }).join('');

  const overallPct = totalPossible > 0 ? Math.round((totalDone/totalPossible)*100) : 0;
  const bestStreak = state.habits.length > 0 ? Math.max(...state.habits.map(h => calcStreak(h.id,y,m,totalDays,td))) : 0;

  document.getElementById('statsRow').innerHTML = `
    <div class="stat-card"><div class="stat-num">${state.habits.length}</div><div class="stat-lbl">Kebiasaan</div></div>
    <div class="stat-card"><div class="stat-num">${overallPct}%</div><div class="stat-lbl">Rata-rata</div></div>
    <div class="stat-card"><div class="stat-num">🔥${bestStreak}</div><div class="stat-lbl">Streak terbaik</div></div>
    <div class="stat-card" style="cursor:pointer" onclick="exportPDF()" title="Ekspor ke PDF">
      <div class="stat-num" style="font-size:18px"><i class="ti ti-download"></i></div>
      <div class="stat-lbl">Ekspor PDF</div>
    </div>`;
}

function renderGrafik() {
  const { viewYear: y, viewMonth: m } = state;
  const totalDays = getDaysInMonth(y, m);
  const el = document.getElementById('grafikContent');
  document.getElementById('monthLabelG').textContent = `${MONTHS[m]} ${y}`;

  if (state.habits.length === 0) {
    el.innerHTML = `<div class="empty-state">Belum ada kebiasaan untuk ditampilkan.</div>`;
    return;
  }

  const firstDay = getFirstDay(y, m);
  const weeks = [];
  let week = [];
  for (let i = 0; i < firstDay; i++) week.push(null);
  for (let d = 1; d <= totalDays; d++) {
    week.push(d);
    if (week.length === 7) { weeks.push(week); week = []; }
  }
  if (week.length) weeks.push(week);

  const weekLabels = weeks.map((w, i) => {
    const valid = w.filter(Boolean);
    return `M${i+1}`;
  });

  el.innerHTML = state.habits.map(h => {
    const weekData = weeks.map(w => {
      const days = w.filter(Boolean);
      const done = days.filter(d => state.logs[logKey(h.id,y,m,d)]).length;
      return days.length > 0 ? Math.round((done/days.length)*100) : 0;
    });

    const bars = weekData.map((pct, i) => {
      const barH = Math.max(4, Math.round((pct/100)*100));
      return `<div class="bar-col">
        <div class="bar-val">${pct}%</div>
        <div class="bar" style="height:${barH}px;background:${h.color};opacity:0.85"></div>
        <div class="bar-lbl">${weekLabels[i]}</div>
      </div>`;
    }).join('');

    return `<div class="chart-wrap">
      <div class="chart-title">
        <span style="width:10px;height:10px;border-radius:50%;background:${h.color};display:inline-block"></span>
        ${h.name}
      </div>
      <div class="bar-chart">${bars}</div>
    </div>`;
  }).join('');
}

function renderCatatan() {
  const el = document.getElementById('catatanContent');
  const allNotes = [];

  Object.keys(state.notes).forEach(k => {
    if (!state.notes[k]) return;
    const parts = k.replace('n_','').split('_');
    if (parts.length < 4) return;
    const hid = parseInt(parts[0]);
    const y = parseInt(parts[1]);
    const m = parseInt(parts[2]);
    const d = parseInt(parts[3]);
    const h = state.habits.find(h => h.id === hid);
    if (!h) return;
    allNotes.push({ hid, y, m, d, habitName: h.name, color: h.color, text: state.notes[k] });
  });

  allNotes.sort((a,b) => (b.y*10000+b.m*100+b.d)-(a.y*10000+a.m*100+a.d));

  if (allNotes.length === 0) {
    el.innerHTML = `<div class="empty-state"><i class="ti ti-notes" style="font-size:28px;display:block;margin-bottom:8px"></i>Belum ada catatan.<br>Klik kanan pada kotak hari di tab Tracker untuk menambah catatan!</div>`;
    return;
  }

  el.innerHTML = `<div class="note-list">` + allNotes.map(n =>
    `<div class="note-card" style="border-left-color:${n.color}">
      <div class="note-card-header">
        <span class="note-habit" style="color:${n.color}">${n.habitName}</span>
        <span class="note-date">${n.d} ${MONTHS[n.m]} ${n.y}</span>
      </div>
      <div class="note-text">${n.text}</div>
    </div>`
  ).join('') + `</div>`;
}

function exportPDF() {
  if (!window.jspdf) { alert('Library PDF belum siap, coba lagi sebentar...'); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const { viewYear: y, viewMonth: m } = state;
  const totalDays = getDaysInMonth(y, m);
  const td = today();

  doc.setFontSize(18);
  doc.setFont('helvetica', 'bold');
  doc.text('Laporan Habit Tracker', 14, 20);

  doc.setFontSize(11);
  doc.setFont('helvetica', 'normal');
  doc.setTextColor(100);
  doc.text(`${MONTHS[m]} ${y}`, 14, 28);
  doc.text(`Diekspor: ${td.d} ${MONTHS[td.m]} ${td.y}`, 14, 34);
  doc.setDrawColor(200);
  doc.line(14, 38, 196, 38);

  let yPos = 46;

  state.habits.forEach((h, idx) => {
    let doneCnt = 0;
    for (let d = 1; d <= totalDays; d++) {
      if (state.logs[logKey(h.id,y,m,d)]) doneCnt++;
    }
    const pct = Math.round((doneCnt/totalDays)*100);
    const streak = calcStreak(h.id, y, m, totalDays, td);

    doc.setFontSize(13);
    doc.setFont('helvetica', 'bold');
    doc.setTextColor(40);
    doc.text(`${idx+1}. ${h.name}`, 14, yPos);

    doc.setFontSize(10);
    doc.setFont('helvetica', 'normal');
    doc.setTextColor(80);
    doc.text(`Selesai: ${doneCnt}/${totalDays} hari  |  ${pct}%  |  Streak: ${streak} hari`, 14, yPos+7);

    const notes = [];
    for (let d = 1; d <= totalDays; d++) {
      const nk = noteKey(h.id,y,m,d);
      if (state.notes[nk]) notes.push({ d, text: state.notes[nk] });
    }

    yPos += 14;

    if (notes.length > 0) {
      doc.setFontSize(10);
      doc.setFont('helvetica', 'italic');
      doc.setTextColor(100);
      notes.forEach(n => {
        const lines = doc.splitTextToSize(`• ${n.d} ${MONTHS[m]}: ${n.text}`, 170);
        doc.text(lines, 18, yPos);
        yPos += lines.length * 6;
        if (yPos > 270) { doc.addPage(); yPos = 20; }
      });
    }

    doc.setDrawColor(220);
    doc.line(14, yPos, 196, yPos);
    yPos += 8;
    if (yPos > 270) { doc.addPage(); yPos = 20; }
  });

  doc.save(`habit-tracker-${MONTHS[m].toLowerCase()}-${y}.pdf`);
}

document.getElementById('noteModal').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
document.getElementById('habitInput').addEventListener('keydown', e => { if (e.key === 'Enter') addHabit(); });

renderColorPick();
render();
</script>
</body>
