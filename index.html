<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Catatan Ibadah Harianku</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --green:#2d6a4f;--green2:#40916c;--green3:#74c69d;--green4:#d8f3dc;
  --gold:#b7934c;--gold2:#e9c46a;
  --text:#1a2e1a;--text2:#4a6741;--text3:#7a9e7e;
  --bg:#f7f3e3;--white:#ffffff;
  --border:rgba(45,106,79,0.15);--border2:rgba(45,106,79,0.3);
  --radius:12px;--radius-lg:18px;--shadow:0 2px 16px rgba(45,106,79,0.08);
}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;background-image:radial-gradient(ellipse at 20% 0%,rgba(116,198,157,0.12) 0%,transparent 50%),radial-gradient(ellipse at 80% 100%,rgba(183,147,76,0.08) 0%,transparent 50%);}
.header{background:var(--green);padding:1.5rem 1rem 4rem;text-align:center;position:relative;overflow:hidden;}
.header::before{content:'';position:absolute;inset:0;background:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.04'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");}
.header-inner{position:relative;z-index:1;}
.header h1{font-family:'Amiri',serif;font-size:26px;color:#fff;margin-bottom:4px;}
.header-arabic{font-family:'Amiri',serif;font-size:20px;color:rgba(255,255,255,0.7);margin-bottom:6px;direction:rtl;}
.header-date{font-size:12px;color:rgba(255,255,255,0.6);}
.nav-card{max-width:680px;margin:-2.5rem auto 0;padding:0 1rem;position:relative;z-index:10;}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:var(--white);border-radius:var(--radius-lg);padding:7px;box-shadow:var(--shadow);border:0.5px solid var(--border);}
.tab{padding:9px 4px;border:none;background:none;border-radius:10px;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;font-size:12px;font-weight:500;color:var(--text2);transition:all 0.2s;display:flex;flex-direction:column;align-items:center;gap:3px;}
.tab-icon{font-size:18px;}
.tab.active{background:var(--green);color:#fff;}
.tab:not(.active):hover{background:var(--green4);}
.container{max-width:680px;margin:1.5rem auto;padding:0 1rem 3rem;}
.tab-content{display:none;}
.tab-content.active{display:block;}
.date-nav{display:flex;align-items:center;justify-content:space-between;background:var(--white);border-radius:var(--radius);padding:11px 14px;margin-bottom:1rem;border:0.5px solid var(--border);box-shadow:var(--shadow);}
.date-nav-btn{background:none;border:0.5px solid var(--border2);border-radius:8px;padding:5px 12px;cursor:pointer;font-size:13px;color:var(--text2);font-family:inherit;}
.date-nav-btn:hover{background:var(--green4);}
.date-label{font-size:14px;font-weight:600;color:var(--text);}
.section-card{background:var(--white);border-radius:var(--radius-lg);border:0.5px solid var(--border);box-shadow:var(--shadow);margin-bottom:1rem;overflow:hidden;}
.section-head{padding:12px 14px;display:flex;align-items:center;gap:8px;border-bottom:0.5px solid var(--border);}
.section-icon{font-size:18px;}
.section-title{font-size:14px;font-weight:600;color:var(--text);}
.section-sub{font-size:12px;color:var(--text3);margin-left:auto;}
.shalat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:7px;padding:10px;}
.shalat-item{border:0.5px solid var(--border2);border-radius:10px;padding:9px 11px;cursor:pointer;transition:all 0.15s;user-select:none;}
.shalat-item:hover{background:var(--green4);}
.shalat-item.checked{background:var(--green);border-color:var(--green);color:#fff;}
.shalat-name{font-size:12px;font-weight:600;display:block;margin-bottom:2px;}
.shalat-rakaat{font-size:10px;opacity:0.7;}
.shalat-check{float:right;font-size:15px;margin-top:-1px;}
.progress-wrap{padding:10px 14px;border-top:0.5px solid var(--border);}
.progress-label{display:flex;justify-content:space-between;font-size:11px;color:var(--text2);margin-bottom:5px;}
.progress-bar{height:7px;background:var(--green4);border-radius:99px;overflow:hidden;}
.progress-fill{height:100%;background:var(--green2);border-radius:99px;transition:width 0.4s;}
.tilawah-form{padding:14px;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:9px;}
.form-group{display:flex;flex-direction:column;gap:4px;}
.form-group.full{grid-column:1/-1;}
label{font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:0.4px;}
input[type=text],input[type=number],select,textarea{padding:8px 11px;border:0.5px solid var(--border2);border-radius:8px;background:var(--bg);color:var(--text);font-size:13px;font-family:inherit;outline:none;width:100%;transition:border 0.15s;}
input:focus,select:focus,textarea:focus{border-color:var(--green2);}
input[readonly]{background:var(--green4);color:var(--green);font-weight:600;}
textarea{height:65px;resize:vertical;}
.save-btn{width:100%;padding:11px;background:var(--green);color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;transition:background 0.15s;margin-top:4px;}
.save-btn:hover{background:var(--green2);}
.save-btn:active{transform:scale(0.99);}
.log-list{display:flex;flex-direction:column;gap:9px;}
.log-card{background:var(--white);border-radius:var(--radius);border:0.5px solid var(--border);padding:12px 14px;box-shadow:var(--shadow);}
.log-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:7px;}
.log-date{font-size:11px;color:var(--text3);}
.log-surat{font-size:14px;font-weight:600;color:var(--text);}
.log-meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:5px;}
.log-badge{font-size:11px;background:var(--green4);color:var(--green);padding:3px 9px;border-radius:99px;font-weight:600;}
.log-badge.gold{background:#fdf3d0;color:var(--gold);}
.log-note{font-size:12px;color:var(--text2);margin-top:7px;font-style:italic;line-height:1.5;}
.del-log{background:none;border:none;cursor:pointer;color:var(--text3);font-size:12px;padding:2px 5px;border-radius:4px;}
.del-log:hover{color:#c0392b;background:#fdecea;}
.rekap-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-bottom:1rem;}
.rekap-card{background:var(--white);border-radius:var(--radius);border:0.5px solid var(--border);padding:13px;text-align:center;box-shadow:var(--shadow);}
.rekap-num{font-size:26px;font-weight:600;color:var(--green);}
.rekap-lbl{font-size:11px;color:var(--text3);margin-top:2px;}
.month-nav{display:flex;align-items:center;gap:10px;background:var(--white);border-radius:var(--radius);padding:10px 14px;margin-bottom:1rem;border:0.5px solid var(--border);box-shadow:var(--shadow);}
.month-lbl{flex:1;text-align:center;font-size:14px;font-weight:600;}
.shalat-rekap-row{background:var(--white);border-radius:var(--radius);border:0.5px solid var(--border);padding:12px 14px;margin-bottom:7px;box-shadow:var(--shadow);}
.shalat-rekap-name{font-size:13px;font-weight:600;color:var(--text);margin-bottom:5px;}
.shalat-rekap-bar{height:6px;background:var(--green4);border-radius:99px;overflow:hidden;margin-bottom:3px;}
.shalat-rekap-fill{height:100%;background:var(--green2);border-radius:99px;}
.shalat-rekap-meta{font-size:11px;color:var(--text3);}
.chart-wrap{background:var(--white);border-radius:var(--radius-lg);border:0.5px solid var(--border);padding:14px;margin-bottom:1rem;box-shadow:var(--shadow);}
.chart-title{font-size:13px;font-weight:600;color:var(--text);margin-bottom:12px;}
.empty-state{text-align:center;padding:2rem 1rem;color:var(--text3);font-size:13px;border:0.5px dashed var(--border2);border-radius:var(--radius-lg);background:var(--white);}
.empty-icon{font-size:32px;display:block;margin-bottom:8px;}
.section-lbl{font-size:12px;font-weight:600;color:var(--text2);margin:12px 4px 8px;text-transform:uppercase;letter-spacing:0.5px;}
</style>
</head>
<body>
<div class="header">
  <div class="header-inner">
    <div class="header-arabic">بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيم</div>
    <h1>Catatan Ibadah Harianku</h1>
    <div class="header-date" id="headerDate"></div>
  </div>
</div>

<div class="nav-card">
  <div class="tabs">
    <button class="tab active" onclick="switchTab('shalat')"><span class="tab-icon">🕌</span>Shalat</button>
    <button class="tab" onclick="switchTab('tilawah')"><span class="tab-icon">📖</span>Tilawah</button>
    <button class="tab" onclick="switchTab('grafik')"><span class="tab-icon">📊</span>Grafik</button>
    <button class="tab" onclick="switchTab('rekap')"><span class="tab-icon">📋</span>Rekap</button>
  </div>
</div>

<div class="container">

  <!-- SHALAT -->
  <div id="tab-shalat" class="tab-content active">
    <div class="date-nav">
      <button class="date-nav-btn" onclick="changeDay(-1)">‹ Kemarin</button>
      <span class="date-label" id="shalatDateLabel"></span>
      <button class="date-nav-btn" onclick="changeDay(1)">Besok ›</button>
    </div>
    <div class="section-card">
      <div class="section-head"><span class="section-icon">🕌</span><span class="section-title">Shalat Wajib (Berjamaah)</span><span class="section-sub" id="wajibCount">0/5</span></div>
      <div class="shalat-grid" id="wajibGrid"></div>
      <div class="progress-wrap">
        <div class="progress-label"><span>Progress Wajib</span><span id="wajibPct">0%</span></div>
        <div class="progress-bar"><div class="progress-fill" id="wajibBar" style="width:0%"></div></div>
      </div>
    </div>
    <div class="section-card">
      <div class="section-head"><span class="section-icon">✨</span><span class="section-title">Shalat Sunnah</span><span class="section-sub" id="sunnahCount">0/10</span></div>
      <div class="shalat-grid" id="sunnahGrid"></div>
      <div class="progress-wrap">
        <div class="progress-label"><span>Progress Sunnah</span><span id="sunnahPct">0%</span></div>
        <div class="progress-bar"><div class="progress-fill" id="sunnahBar" style="width:0%"></div></div>
      </div>
    </div>
  </div>

  <!-- TILAWAH -->
  <div id="tab-tilawah" class="tab-content">
    <div class="section-card" style="margin-bottom:1rem">
      <div class="section-head"><span class="section-icon">📝</span><span class="section-title">Tambah Catatan Tilawah</span></div>
      <div class="tilawah-form">
        <div class="form-row">
          <div class="form-group">
            <label>Tanggal</label>
            <input type="text" id="tilDate" readonly/>
          </div>
          <div class="form-group">
            <label>Juz</label>
            <select id="tilJuz">
              <option value="">Pilih Juz</option>
              <option value="1">Juz 1</option><option value="2">Juz 2</option><option value="3">Juz 3</option><option value="4">Juz 4</option><option value="5">Juz 5</option><option value="6">Juz 6</option><option value="7">Juz 7</option><option value="8">Juz 8</option><option value="9">Juz 9</option><option value="10">Juz 10</option><option value="11">Juz 11</option><option value="12">Juz 12</option><option value="13">Juz 13</option><option value="14">Juz 14</option><option value="15">Juz 15</option><option value="16">Juz 16</option><option value="17">Juz 17</option><option value="18">Juz 18</option><option value="19">Juz 19</option><option value="20">Juz 20</option><option value="21">Juz 21</option><option value="22">Juz 22</option><option value="23">Juz 23</option><option value="24">Juz 24</option><option value="25">Juz 25</option><option value="26">Juz 26</option><option value="27">Juz 27</option><option value="28">Juz 28</option><option value="29">Juz 29</option><option value="30">Juz 30</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Nama Surat (opsional)</label>
            <select id="tilSurat">
              <option value="">Pilih Surat</option>
              <option>Al-Fatihah</option><option>Al-Baqarah</option><option>Ali 'Imran</option><option>An-Nisa'</option><option>Al-Ma'idah</option><option>Al-An'am</option><option>Al-A'raf</option><option>Al-Anfal</option><option>At-Taubah</option><option>Yunus</option><option>Hud</option><option>Yusuf</option><option>Ar-Ra'd</option><option>Ibrahim</option><option>Al-Hijr</option><option>An-Nahl</option><option>Al-Isra'</option><option>Al-Kahf</option><option>Maryam</option><option>Ta Ha</option><option>Al-Anbiya'</option><option>Al-Hajj</option><option>Al-Mu'minun</option><option>An-Nur</option><option>Al-Furqan</option><option>Asy-Syu'ara'</option><option>An-Naml</option><option>Al-Qasas</option><option>Al-'Ankabut</option><option>Ar-Rum</option><option>Luqman</option><option>As-Sajdah</option><option>Al-Ahzab</option><option>Saba'</option><option>Fatir</option><option>Ya Sin</option><option>As-Saffat</option><option>Sad</option><option>Az-Zumar</option><option>Ghafir</option><option>Fussilat</option><option>Asy-Syura</option><option>Az-Zukhruf</option><option>Ad-Dukhan</option><option>Al-Jasiyah</option><option>Al-Ahqaf</option><option>Muhammad</option><option>Al-Fath</option><option>Al-Hujurat</option><option>Qaf</option><option>Az-Zariyat</option><option>At-Tur</option><option>An-Najm</option><option>Al-Qamar</option><option>Ar-Rahman</option><option>Al-Waqi'ah</option><option>Al-Hadid</option><option>Al-Mujadilah</option><option>Al-Hasyr</option><option>Al-Mumtahanah</option><option>As-Saf</option><option>Al-Jumu'ah</option><option>Al-Munafiqun</option><option>At-Tagabun</option><option>At-Talaq</option><option>At-Tahrim</option><option>Al-Mulk</option><option>Al-Qalam</option><option>Al-Haqqah</option><option>Al-Ma'arij</option><option>Nuh</option><option>Al-Jinn</option><option>Al-Muzzammil</option><option>Al-Muddassir</option><option>Al-Qiyamah</option><option>Al-Insan</option><option>Al-Mursalat</option><option>An-Naba'</option><option>An-Nazi'at</option><option>'Abasa</option><option>At-Takwir</option><option>Al-Infitar</option><option>Al-Mutaffifin</option><option>Al-Insyiqaq</option><option>Al-Buruj</option><option>At-Tariq</option><option>Al-A'la</option><option>Al-Gasyiyah</option><option>Al-Fajr</option><option>Al-Balad</option><option>Asy-Syams</option><option>Al-Lail</option><option>Ad-Duha</option><option>Asy-Syarh</option><option>At-Tin</option><option>Al-'Alaq</option><option>Al-Qadr</option><option>Al-Bayyinah</option><option>Az-Zalzalah</option><option>Al-'Adiyat</option><option>Al-Qari'ah</option><option>At-Takasur</option><option>Al-'Asr</option><option>Al-Humazah</option><option>Al-Fil</option><option>Quraisy</option><option>Al-Ma'un</option><option>Al-Kausar</option><option>Al-Kafirun</option><option>An-Nasr</option><option>Al-Masad</option><option>Al-Ikhlas</option><option>Al-Falaq</option><option>An-Nas</option>
            </select>
          </div>
          <div class="form-group">
            <label>Ayat</label>
            <input type="text" id="tilAyat" placeholder="cth: 1–20"/>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Halaman Mulai</label>
            <input type="number" id="tilHalMulai" min="1" max="604" placeholder="1" oninput="autoLembar()"/>
          </div>
          <div class="form-group">
            <label>Halaman Selesai</label>
            <input type="number" id="tilHalSelesai" min="1" max="604" placeholder="604" oninput="autoLembar()"/>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group full">
            <label>Jumlah Lembar (otomatis dari halaman)</label>
            <input type="number" id="tilLembar" min="1" placeholder="—" readonly/>
          </div>
        </div>
        <div class="form-group full" style="margin-bottom:10px">
          <label>Catatan</label>
          <textarea id="tilCatatan" placeholder="Refleksi, ayat favorit, dll..."></textarea>
        </div>
        <button class="save-btn" onclick="saveTilawah()">💾 Simpan Catatan Tilawah</button>
      </div>
    </div>
    <div class="section-lbl">Riwayat Tilawah</div>
    <div id="tilawahList"></div>
  </div>

  <!-- GRAFIK -->
  <div id="tab-grafik" class="tab-content">
    <div class="month-nav">
      <button class="date-nav-btn" onclick="changeGrafikMonth(-1)">‹</button>
      <span class="month-lbl" id="grafikMonthLabel"></span>
      <button class="date-nav-btn" onclick="changeGrafikMonth(1)">›</button>
    </div>
    <div class="chart-wrap">
      <div class="chart-title">📖 Lembar Tilawah per Hari</div>
      <canvas id="chartLembar" height="180"></canvas>
    </div>
    <div class="chart-wrap">
      <div class="chart-title">🕌 Shalat Wajib Berjamaah per Hari</div>
      <canvas id="chartShalat" height="180"></canvas>
    </div>
  </div>

  <!-- REKAP -->
  <div id="tab-rekap" class="tab-content">
    <div class="month-nav">
      <button class="date-nav-btn" onclick="changeRekapMonth(-1)">‹</button>
      <span class="month-lbl" id="rekapMonthLabel"></span>
      <button class="date-nav-btn" onclick="changeRekapMonth(1)">›</button>
    </div>
    <div class="section-lbl">Tilawah Bulan Ini</div>
    <div class="rekap-grid" id="rekapTilawah"></div>
    <div class="section-lbl">Shalat Wajib Berjamaah</div>
    <div id="rekapShalat"></div>
  </div>

</div>

<script>
const WAJIB=[
  {id:'subuh',name:'Subuh',rakaat:'2 rakaat'},
  {id:'dzuhur',name:'Dzuhur',rakaat:'4 rakaat'},
  {id:'ashar',name:'Ashar',rakaat:'4 rakaat'},
  {id:'maghrib',name:'Maghrib',rakaat:'3 rakaat'},
  {id:'isya',name:'Isya',rakaat:'4 rakaat'},
];
const SUNNAH=[
  {id:'tahajud',name:'Tahajud',rakaat:'2–8 rakaat'},
  {id:'witir',name:'Witir',rakaat:'1–11 rakaat'},
  {id:'qiyamul_lail',name:'Qiyamul Lail',rakaat:'2–8 rakaat'},
  {id:'rawatib_qbl_subuh',name:'Rawatib Qabliyah Subuh',rakaat:'2 rakaat'},
  {id:'dhuha',name:'Dhuha',rakaat:'2–12 rakaat'},
  {id:'rawatib_qbl_dzuhur2',name:'Rawatib Qabliyah Dzuhur 2',rakaat:'2 rakaat'},
  {id:'rawatib_qbl_dzuhur4',name:'Rawatib Qabliyah Dzuhur 4',rakaat:'4 rakaat'},
  {id:'rawatib_bkd_dzuhur',name:"Rawatib Ba'diyah Dzuhur",rakaat:'2 rakaat'},
  {id:'rawatib_bkd_maghrib',name:"Rawatib Ba'diyah Maghrib",rakaat:'2 rakaat'},
  {id:'rawatib_bkd_isya',name:"Rawatib Ba'diyah Isya",rakaat:'2 rakaat'},
];
const MONTHS=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];

let viewDate=new Date(); viewDate.setHours(0,0,0,0);
let rekapDate=new Date();
let grafikDate=new Date();
let chartInstances={};

let data={shalat:{},tilawah:[]};
try{const s=JSON.parse(localStorage.getItem('ibadahTrackerV2')||'{}');if(s.shalat)data=s;}catch(e){}

function save(){try{localStorage.setItem('ibadahTrackerV2',JSON.stringify(data));}catch(e){}}
function dateKey(d){return `${d.getFullYear()}_${d.getMonth()}_${d.getDate()}`;}
function formatDate(d){const days=['Ahad','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];return `${days[d.getDay()]}, ${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;}
function getDaysInMonth(y,m){return new Date(y,m+1,0).getDate();}

function switchTab(name){
  document.querySelectorAll('.tab-content').forEach(el=>el.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(el=>el.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  const idx=['shalat','tilawah','grafik','rekap'].indexOf(name);
  document.querySelectorAll('.tab')[idx].classList.add('active');
  if(name==='rekap') renderRekap();
  if(name==='tilawah'){renderTilawah();document.getElementById('tilDate').value=formatDate(new Date());}
  if(name==='grafik') renderGrafik();
}

function changeDay(dir){viewDate.setDate(viewDate.getDate()+dir);renderShalat();}
function changeRekapMonth(dir){rekapDate.setMonth(rekapDate.getMonth()+dir);renderRekap();}
function changeGrafikMonth(dir){grafikDate.setMonth(grafikDate.getMonth()+dir);renderGrafik();}

function toggleShalat(id){
  const k=dateKey(viewDate);
  if(!data.shalat[k]) data.shalat[k]={};
  data.shalat[k][id]=!data.shalat[k][id];
  save(); renderShalat();
}

function renderShalat(){
  const k=dateKey(viewDate);
  const log=data.shalat[k]||{};
  document.getElementById('shalatDateLabel').textContent=formatDate(viewDate);

  let wajibDone=0;
  document.getElementById('wajibGrid').innerHTML=WAJIB.map(s=>{
    const checked=!!log[s.id]; if(checked) wajibDone++;
    return `<div class="shalat-item${checked?' checked':''}" onclick="toggleShalat('${s.id}')">
      <span class="shalat-check">${checked?'✓':'○'}</span>
      <span class="shalat-name">${s.name}</span>
      <span class="shalat-rakaat">${s.rakaat}</span>
    </div>`;
  }).join('');
  const wp=Math.round((wajibDone/WAJIB.length)*100);
  document.getElementById('wajibCount').textContent=`${wajibDone}/${WAJIB.length}`;
  document.getElementById('wajibPct').textContent=wp+'%';
  document.getElementById('wajibBar').style.width=wp+'%';

  let sunnahDone=0;
  document.getElementById('sunnahGrid').innerHTML=SUNNAH.map(s=>{
    const checked=!!log[s.id]; if(checked) sunnahDone++;
    return `<div class="shalat-item${checked?' checked':''}" onclick="toggleShalat('${s.id}')">
      <span class="shalat-check">${checked?'✓':'○'}</span>
      <span class="shalat-name">${s.name}</span>
      <span class="shalat-rakaat">${s.rakaat}</span>
    </div>`;
  }).join('');
  const sp=Math.round((sunnahDone/SUNNAH.length)*100);
  document.getElementById('sunnahCount').textContent=`${sunnahDone}/${SUNNAH.length}`;
  document.getElementById('sunnahPct').textContent=sp+'%';
  document.getElementById('sunnahBar').style.width=sp+'%';
}

function autoLembar(){
  const mulai=parseInt(document.getElementById('tilHalMulai').value)||0;
  const selesai=parseInt(document.getElementById('tilHalSelesai').value)||0;
  if(mulai>0&&selesai>=mulai){
    document.getElementById('tilLembar').value=selesai-mulai+1;
  } else {
    document.getElementById('tilLembar').value='';
  }
}

function saveTilawah(){
  const surat=document.getElementById('tilSurat').value;
  const juz=document.getElementById('tilJuz').value;
  const ayat=document.getElementById('tilAyat').value.trim();
  const halMulai=document.getElementById('tilHalMulai').value;
  const halSelesai=document.getElementById('tilHalSelesai').value;
  const lembar=document.getElementById('tilLembar').value;
  const catatan=document.getElementById('tilCatatan').value.trim();
  if(!surat&&!juz){alert('Isi minimal nama surat atau juz ya!');return;}
  const entry={
    id:Date.now(),
    date:new Date().toISOString().split('T')[0],
    dateLabel:formatDate(new Date()),
    surat,juz,ayat,halMulai,halSelesai,
    lembar:lembar?parseInt(lembar):null,
    catatan,
  };
  data.tilawah.unshift(entry);
  save();
  ['tilAyat','tilHalMulai','tilHalSelesai','tilLembar','tilCatatan'].forEach(id=>{document.getElementById(id).value='';});
  document.getElementById('tilSurat').value='';
  document.getElementById('tilJuz').value='';
  renderTilawah();
}

function deleteTilawah(id){
  if(!confirm('Hapus catatan ini?'))return;
  data.tilawah=data.tilawah.filter(t=>t.id!==id);
  save(); renderTilawah();
}

function renderTilawah(){
  const el=document.getElementById('tilawahList');
  if(data.tilawah.length===0){el.innerHTML=`<div class="empty-state"><span class="empty-icon">📖</span>Belum ada catatan tilawah.<br>Yuk mulai isi di form di atas!</div>`;return;}
  el.innerHTML=`<div class="log-list">${data.tilawah.map(t=>`
    <div class="log-card">
      <div class="log-header">
        <div>
          <div class="log-surat">${t.surat||'Tilawah'} ${t.ayat?`(${t.ayat})`:''}</div>
          <div class="log-date">${t.dateLabel}</div>
        </div>
        <button class="del-log" onclick="deleteTilawah(${t.id})">🗑</button>
      </div>
      <div class="log-meta">
        ${t.juz?`<span class="log-badge">Juz ${t.juz}</span>`:''}
        ${t.halMulai&&t.halSelesai?`<span class="log-badge">Hal ${t.halMulai}–${t.halSelesai}</span>`:''}
        ${t.lembar?`<span class="log-badge gold">${t.lembar} lembar</span>`:''}
      </div>
      ${t.catatan?`<div class="log-note">"${t.catatan}"</div>`:''}
    </div>
  `).join('')}</div>`;
}

function renderGrafik(){
  const y=grafikDate.getFullYear();
  const m=grafikDate.getMonth();
  document.getElementById('grafikMonthLabel').textContent=`${MONTHS[m]} ${y}`;
  const days=getDaysInMonth(y,m);
  const labels=Array.from({length:days},(_,i)=>i+1);

  const lembarData=labels.map(d=>{
    const dateStr=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    return data.tilawah.filter(t=>t.date===dateStr).reduce((s,t)=>s+(t.lembar||0),0);
  });

  const shalatData=labels.map(d=>{
    const k=`${y}_${m}_${d}`;
    const log=data.shalat[k]||{};
    return WAJIB.filter(s=>log[s.id]).length;
  });

  function makeChart(id,label,dataset,color,type='bar'){
    if(chartInstances[id]) chartInstances[id].destroy();
    const ctx=document.getElementById(id).getContext('2d');
    chartInstances[id]=new Chart(ctx,{
      type,
      data:{labels,datasets:[{label,data:dataset,backgroundColor:color+'33',borderColor:color,borderWidth:2,borderRadius:4,fill:type==='line',tension:0.3,pointRadius:3,pointBackgroundColor:color}]},
      options:{responsive:true,plugins:{legend:{display:false}},scales:{x:{grid:{display:false},ticks:{font:{size:10},maxRotation:0}},y:{beginAtZero:true,grid:{color:'rgba(0,0,0,0.05)'},ticks:{font:{size:10},stepSize:1}}}}
    });
  }

  makeChart('chartLembar','Lembar',lembarData,'#2d6a4f');
  makeChart('chartShalat','Shalat Wajib',shalatData,'#40916c');
}

function renderRekap(){
  const y=rekapDate.getFullYear();
  const m=rekapDate.getMonth();
  document.getElementById('rekapMonthLabel').textContent=`${MONTHS[m]} ${y}`;
  const daysInMonth=getDaysInMonth(y,m);

  const monthTilawah=data.tilawah.filter(t=>{const d=new Date(t.date);return d.getFullYear()===y&&d.getMonth()===m;});
  const totalLembar=monthTilawah.reduce((s,t)=>s+(t.lembar||0),0);
  const hariTilawah=new Set(monthTilawah.map(t=>t.date)).size;

  document.getElementById('rekapTilawah').innerHTML=`
    <div class="rekap-card"><div class="rekap-num">${hariTilawah}</div><div class="rekap-lbl">Hari tilawah</div></div>
    <div class="rekap-card"><div class="rekap-num">${totalLembar}</div><div class="rekap-lbl">Total lembar</div></div>
  `;

  const shalatStats={};
  WAJIB.forEach(s=>shalatStats[s.id]={name:s.name,done:0});
  for(let d=1;d<=daysInMonth;d++){
    const k=`${y}_${m}_${d}`;
    const log=data.shalat[k]||{};
    WAJIB.forEach(s=>{if(log[s.id])shalatStats[s.id].done++;});
  }

  document.getElementById('rekapShalat').innerHTML=WAJIB.map(s=>{
    const st=shalatStats[s.id];
    const pct=Math.round((st.done/daysInMonth)*100);
    return `<div class="shalat-rekap-row">
      <div class="shalat-rekap-name">${st.name} <span style="color:var(--text3);font-weight:400;font-size:11px">berjamaah</span></div>
      <div class="shalat-rekap-bar"><div class="shalat-rekap-fill" style="width:${pct}%"></div></div>
      <div class="shalat-rekap-meta">${st.done}/${daysInMonth} hari · ${pct}%</div>
    </div>`;
  }).join('');
}

document.getElementById('headerDate').textContent=formatDate(new Date());
document.getElementById('tilDate').value=formatDate(new Date());
renderShalat();
renderTilawah();
</script>
</body>
